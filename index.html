
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Bookstore</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#202b3c}
header{background:#17365d;color:white;padding:22px;text-align:center}
main{max-width:1100px;margin:25px auto;padding:0 16px}
.panel{background:white;padding:18px;border-radius:10px;margin-bottom:20px}
input,select,button{padding:10px;margin:5px;border:1px solid #ccc;border-radius:5px}
button{background:#17365d;color:white;cursor:pointer}
button:hover{background:#28578d}
#books{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.book{background:white;border:1px solid #ddd;border-radius:9px;padding:17px}
.book h3{margin-top:5px}
.price{font-size:20px;font-weight:bold;color:#17365d}
.available{color:green;font-weight:bold}
.unavailable{color:#b42318;font-weight:bold}
small{color:#667085}
footer{text-align:center;padding:20px;color:#667085}
</style>
</head>
<body>
<header>
  <h1>Online Bookstore</h1>
  <p>Discover your next favourite book</p>
</header>
<main>
  <section class="panel">
    <h2>Browse Books</h2>
    <input id="search" placeholder="Search title or author" oninput="renderBooks()">
    <select id="category" onchange="renderBooks()">
      <option value="All">All Categories</option>
      <option>Programming</option><option>Fiction</option>
      <option>Science</option><option>Business</option>
    </select>
    <p id="count"></p>
    <div id="books"></div>
  </section>

  <section class="panel">
    <h2>Shopping Cart</h2>
    <div id="cart">Your cart is empty.</div>
    <p id="total">Total: ₹0</p>
    <button onclick="placeOrder()">Place Order</button>
    <p id="orderMessage"></p>
  </section>

  <section class="panel">
    <h2>Track Order</h2>
    <input id="trackId" placeholder="Enter order ID">
    <button onclick="trackOrder()">Track</button>
    <p id="trackingResult"></p>
  </section>

  <section class="panel">
    <h2>Why Shop With Us?</h2>
    <p>Browse curated books, compare prices and manage your orders in one place.</p>
  </section>
</main>
<footer>Online Bookstore | CI/CD Demonstration</footer>

<script>
const inventory = [
 {id:1,title:"Clean Code",author:"Robert C. Martin",category:"Programming",price:650,stock:8},
 {id:2,title:"The Pragmatic Programmer",author:"Andrew Hunt",category:"Programming",price:550,stock:5},
 {id:3,title:"The Alchemist",author:"Paulo Coelho",category:"Fiction",price:299,stock:10},
 {id:4,title:"1984",author:"George Orwell",category:"Fiction",price:250,stock:0},
 {id:5,title:"A Brief History of Time",author:"Stephen Hawking",category:"Science",price:399,stock:4},
 {id:6,title:"Atomic Habits",author:"James Clear",category:"Business",price:450,stock:7}
];
let cart = {};
let orders = {};

function renderBooks(){
 const q=document.getElementById("search").value.toLowerCase();
 const cat=document.getElementById("category").value;
 const results=inventory.filter(b=>
  (b.title.toLowerCase().includes(q)||b.author.toLowerCase().includes(q)) &&
  (cat==="All"||b.category===cat));
 document.getElementById("count").textContent=results.length+" books found";
 document.getElementById("books").innerHTML=results.map(b=>`
  <article class="book">
   <small>${b.category}</small>
   <h3>${b.title}</h3>
   <p>Author: ${b.author}</p>
   <p class="price">₹${b.price}</p>
   <p class="${b.stock?'available':'unavailable'}">
    ${b.stock?'In Stock ('+b.stock+')':'Out of Stock'}
   </p>
   <button onclick="addToCart(${b.id})" ${b.stock?'':'disabled'}>
    Add to Cart
   </button>
  </article>`).join("");
}
function addToCart(id){
 const b=inventory.find(x=>x.id===id);
 if(!b||b.stock<=0)return;
 if((cart[id]||0)>=b.stock){alert("Stock limit reached");return;}
 cart[id]=(cart[id]||0)+1;
 renderCart();
}
function renderCart(){
 const ids=Object.keys(cart);
 document.getElementById("cart").innerHTML=ids.length?
 ids.map(id=>{
  const b=inventory.find(x=>x.id===Number(id));
  return `${b.title} × ${cart[id]} — ₹${b.price*cart[id]}`;
 }).join("<br>"):"Your cart is empty.";
 const total=ids.reduce((s,id)=>s+
  inventory.find(b=>b.id===Number(id)).price*cart[id],0);
 document.getElementById("total").textContent="Total: ₹"+total;
}
function placeOrder(){
 if(!Object.keys(cart).length){alert("Add a book first");return;}
 for(const id of Object.keys(cart)){
  const b=inventory.find(x=>x.id===Number(id));
  if(cart[id]>b.stock){alert("Insufficient stock");return;}
 }
 const id="BK"+Date.now();
 for(const key of Object.keys(cart)){
  inventory.find(b=>b.id===Number(key)).stock-=cart[key];
 }
 orders[id]={status:"Confirmed",items:{...cart}};
 document.getElementById("orderMessage").textContent=
  "Order placed successfully. Your order ID is "+id;
 document.getElementById("trackId").value=id;
 cart={};renderCart();renderBooks();trackOrder();
}
function trackOrder(){
 const id=document.getElementById("trackId").value.trim();
 const order=orders[id];
 document.getElementById("trackingResult").textContent=order?
  "Order "+id+" — Status: "+order.status:
  "Order not found in this browser session.";
}
renderBooks();renderCart();
</script>
</body>
</html>
